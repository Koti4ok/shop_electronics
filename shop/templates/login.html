<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід | PC Store</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0c10; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #141a22; padding: 40px; border-radius: 16px; width: 360px; border: 1px solid #45f3ff33; box-shadow: 0 0 20px rgba(0,245,255,0.1); }
        h2 { color: #00f5ff; text-align: center; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }
        p { margin-top: 15px; display: flex; flex-direction: column; color: #8b9bb4; font-size: 0.85rem; }
        input { padding: 12px; margin-top: 6px; background: #1f2833; border: 1px solid #2f3b4c; color: white; border-radius: 8px; outline: none; }
        button { width: 100%; padding: 14px; background: #5865F2; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 25px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Вхід до аккаунту</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Увійти</button>
        </form>
        <a href="{% url 'home' %}" style="display:block; text-align:center; margin-top:15px; color:#8b9bb4; text-decoration:none; font-size:0.9rem;">← На головну</a>
    </div>
</body>
</html>
