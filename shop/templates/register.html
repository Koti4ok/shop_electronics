<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація | PC Store</title>
    <style>
        body { background: #0f111a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0; }
        .form-box { background: #1a1d29; padding: 40px; border-radius: 16px; border: 1px solid #24293e; width: 340px; }
        h2 { color: #ff3333; text-align: center; margin-bottom: 25px; }
        p { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #7e84a3; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; background: #12141d; border: 1px solid #24293e; color: #fff; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #ff3333; }
        button { width: 100%; padding: 12px; background: #ff3333; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; color: #fff; font-size: 1rem; margin-top: 15px; }
        .error-message { color: #ff3333; font-size: 0.85rem; margin-top: 5px; }
        .helptext { display: block; font-size: 0.75rem; color: #525875; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Реєстрація</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <p>
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}<span class="helptext">{{ field.help_text|safe }}</span>{% endif %}
                    {% for error in field.errors %}<div class="error-message">⚠️ {{ error }}</div>{% endfor %}
                </p>
            {% endfor %}
            <button type="submit">Створити акаунт</button>
        </form>
    </div>
</body>
</html>
