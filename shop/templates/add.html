<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC STORE | Додати товар</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Змінні кольорів для темної та світлої тем */
        :root {
            --bg-color: #05070a;
            --card-bg: #0d111a;
            --card-border: #1e293b;
            --text-main: #ffffff;
            --text-muted: #8e9aaf;
            --accent-cyan: #00f2fe;
            --accent-red: #ff0055;
            --input-bg: #161b26;
            --border: #1e293b;
            --shadow: rgba(0, 0, 0, 0.5);
            --logo-gradient: linear-gradient(135deg, #00f2fe 0%, #ff0055 50%, #00f2fe 100%);
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-cyan: #3b82f6;
            --accent-red: #e11d48;
            --input-bg: #f8fafc;
            --border: #cbd5e1;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Urbanist', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 60px 20px;
            transition: background-color 0.4s ease;
        }

        .form-container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 50px var(--shadow);
            position: relative;
            transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* Анімоване переливне лого PC STORE */
        .pc-store-logo {
            position: absolute;
            top: 35px;
            left: 40px;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 3px;
            background: var(--logo-gradient);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: logo-burn 4s linear infinite;
        }

        @keyframes logo-burn {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ПАНЕЛЬ КЕРУВАННЯ У ВЕРХНЬОМУ КУТКУ */
        .back-btn {
            position: absolute;
            top: 25px;
            right: 95px;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .back-btn:hover {
            transform: translateX(-4px) scale(1.05);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .theme-toggle {
            position: absolute;
            top: 25px;
            right: 40px;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .theme-toggle:hover {
            transform: rotate(30deg) scale(1.05);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Водяний знак у кутку */
        .watermark {
            position: absolute;
            bottom: -35px;
            right: 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .watermark span {
            color: var(--accent-red);
        }

        h2 {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 50px;
            margin-bottom: 30px;
            background: linear-gradient(90deg, var(--accent-cyan), #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Форма в один стовпчик */
        .vertical-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            font-family: 'Urbanist', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.15);
        }

        .file-upload-wrapper {
            position: relative;
            width: 100%;
        }

        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            background-color: var(--input-bg);
            border: 2px dashed var(--border);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .file-upload-label:hover {
            border-color: var(--accent-cyan);
            background-color: rgba(0, 242, 254, 0.05);
        }

        .file-upload-label span {
            font-size: 14px;
            color: var(--text-main);
        }

        /* Специфікації заліза у стовпчик */
        .dynamic-specs {
            background: rgba(0, 242, 254, 0.03);
            border-left: 4px solid var(--accent-cyan);
            padding: 15px 20px;
            border-radius: 0 16px 16px 0;
            display: none;
            flex-direction: column;
            gap: 15px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ЗЕЛЕНА КНОПКА ЗБЕРЕЖЕННЯ */
        .btn-submit {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #00ff66 0%, #00bc52 100%);
            color: white;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 255, 102, 0.25);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 255, 102, 0.4);
            filter: brightness(1.1);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="pc-store-logo">PC STORE</div>

    <a href="/" class="back-btn" title="Повернутись на головну">←</a>
    <div class="theme-toggle" id="theme-btn">☀️</div>

    <h2>Додати новий товар</h2>

    <form class="vertical-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Категорія -->
        <div class="form-group">
            <label>Категорія товару</label>
            <select name="category" id="id_category" required>
                <option value="">-- Оберіть категорію --</option>
                <option value="cpu">Процесори (CPU)</option>
                <option value="gpu">Відеокарти (GPU)</option>
                <option value="ram">Оперативна пам'ять (RAM)</option>
                <option value="monitor">Монітори</option>
            </select>
        </div>

        <!-- Бренд / Чіпмейкер -->
        <div class="form-group">
            <label id="brand-label">Бренд</label>
            <select name="brand" id="id_brand" required>
                <option value="">-- Спочатку оберіть категорію --</option>
            </select>
        </div>

        <!-- Назва моделі -->
        <div class="form-group">
            <label>Назва моделі</label>
            <input type="text" name="name" placeholder="Наприклад: Core i5-13400F або RTX 4060 Ti" required>
        </div>

        <!-- Ціна -->
        <div class="form-group">
            <label>Ціна (грн)</label>
            <input type="number" name="price" step="0.01" value="0" required>
        </div>

        <!-- Опис -->
        <div class="form-group">
            <label>Опис товару</label>
            <textarea name="description" rows="3" placeholder="Технічний опис девайсу..."></textarea>
        </div>

        <!-- Зображення -->
        <div class="form-group">
            <label>Зображення</label>
            <div class="file-upload-wrapper">
                <label class="file-upload-label" for="id_image">
                    <span id="file-chosen">Обрати файл зображення</span>
                </label>
                <input type="file" name="image" id="id_image" style="display: none;">
            </div>
        </div>

        <!-- ДИНАМІЧНІ ХАРАКТЕРИСТИКИ -->

        <!-- CPU Блок -->
        <div id="box-cpu" class="dynamic-specs">
            <div class="form-group">
                <label>Кількість ядер</label>
                <input type="number" name="cpu_cores" placeholder="Наприклад: 6">
            </div>
            <div class="form-group">
                <label>Кількість потоків</label>
                <input type="number" name="cpu_threads" placeholder="Наприклад: 12">
            </div>
            <div class="form-group">
                <label>Частота процесора</label>
                <input type="text" name="cpu_frequency" placeholder="Наприклад: 4.6 GHz">
            </div>
        </div>

        <!-- GPU Блок (З Оновленим Виконанням/Вендором) -->
        <div id="box-gpu" class="dynamic-specs">
            <div class="form-group">
                <label>Виконання / Вендор (Виробник карти)</label>
                <select name="gpu_vendor">
                    <option value="">-- Оберіть тип виконання --</option>
                    <option value="ASUS">ASUS</option>
                    <option value="MSI">MSI</option>
                    <option value="Gigabyte">Gigabyte</option>
                    <option value="Palit">Palit</option>
                    <option value="Sapphire">Sapphire</option>
                    <option value="Gainward">Gainward</option>
                    <option value="XFX">XFX</option>
                    <option value="Zotac">Zotac</option>
                    <option value="Inno3D">Inno3D</option>
                    <option value="Founders Edition">Founders Edition (Реф)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Об'єм відеопам'яті (ГБ)</label>
                <input type="number" name="gpu_memory_size" placeholder="Наприклад: 8">
            </div>
            <div class="form-group">
                <label>Тип пам'яті</label>
                <input type="text" name="gpu_memory_type" placeholder="Наприклад: GDDR6X">
            </div>
        </div>

        <!-- RAM Блок -->
        <div id="box-ram" class="dynamic-specs">
            <div class="form-group">
                <label>Об'єм пам'яті (ГБ)</label>
                <input type="number" name="ram_size" placeholder="Наприклад: 16">
            </div>
            <div class="form-group">
                <label>Частота пам'яті</label>
                <input type="text" name="ram_speed" placeholder="Наприклад: 3200 MHz">
            </div>
        </div>

        <!-- Монітори Блок -->
        <div id="box-monitor" class="dynamic-specs">
            <div class="form-group">
                <label>Діагональ екрану</label>
                <input type="text" name="monitor_diagonal" placeholder="Наприклад: 27&quot;">
            </div>
            <div class="form-group">
                <label>Частота оновлення (Гц)</label>
                <input type="number" name="monitor_hz" placeholder="Наприклад: 144">
            </div>
            <div class="form-group">
                <label>Тип матриці</label>
                <input type="text" name="monitor_panel" placeholder="Наприклад: IPS">
            </div>
        </div>

        <button type="submit" class="btn-submit">Зберегти девайс у базу 🚀</button>
    </form>

    <!-- Водяний знак -->
    <div class="watermark">premium tech // by:<span>Koti4ok</span></div>
</div>

<script>
// --- СИНХРОНІЗАЦІЯ ТЕМ (LOCALSTORAGE) ---
const themeBtn = document.getElementById('theme-btn');

const applyTheme = (theme) => {
    if (theme === 'light') {
        document.body.classList.add('light-mode');
        themeBtn.innerHTML = '🌙';
    } else {
        document.body.classList.remove('light-mode');
        themeBtn.innerHTML = '☀️';
    }
};

applyTheme(localStorage.getItem('pc-theme') || 'dark');

themeBtn.addEventListener('click', () => {
    const isLight = document.body.classList.contains('light-mode');
    const newTheme = isLight ? 'dark' : 'light';
    localStorage.setItem('pc-theme', newTheme);
    applyTheme(newTheme);
});

// --- ДИНАМІЧНИЙ ТЕКСТ ЗАВАНТАЖЕННЯ ФАЙЛУ ---
const fileInput = document.getElementById('id_image');
const fileChosen = document.getElementById('file-chosen');
fileInput.addEventListener('change', function() {
    fileChosen.textContent = this.files.length > 0 ? this.files[0].name : "Обрати файл зображення";
});

// --- ОНОВЛЕНА ЛОГІКА ДИНАМІЧНИХ КАТЕГОРІЙ (ЧІПМЕЙКЕРИ ОКРЕМO) ---
const brandsData = {
    'cpu': ['Intel', 'AMD'],
    'gpu': ['NVIDIA', 'AMD', 'Intel'], // Тільки творці чіпів
    'ram': ['Kingston FURY', 'G.Skill', 'Corsair', 'Crucial', 'Team Group'],
    'monitor': ['Samsung', 'LG', 'ASUS', 'MSI', 'Acer', 'AOC']
};

const categorySelect = document.getElementById('id_category');
const brandSelect = document.getElementById('id_brand');
const brandLabel = document.getElementById('brand-label');

categorySelect.addEventListener('change', function() {
    const selectedCategory = this.value;

    document.getElementById('box-cpu').style.display = 'none';
    document.getElementById('box-gpu').style.display = 'none';
    document.getElementById('box-ram').style.display = 'none';
    document.getElementById('box-monitor').style.display = 'none';

    if (selectedCategory) {
        const activeBox = document.getElementById('box-' + selectedCategory);
        if (activeBox) activeBox.style.display = 'flex';
    }

    // Зміна назви мітки для наочності
    if (selectedCategory === 'gpu') {
        brandLabel.textContent = "Виробник GPU (Чіпсет)";
    } else {
        brandLabel.textContent = "Бренд";
    }

    brandSelect.innerHTML = '';
    if (!selectedCategory) {
        brandSelect.innerHTML = '<option value="">-- Спочатку оберіть категорію --</option>';
        return;
    }

    const availableBrands = brandsData[selectedCategory] || [];
    availableBrands.forEach(brand => {
        const option = document.createElement('option');
        option.value = brand;
        option.textContent = brand;
        brandSelect.appendChild(option);
    });
});
</script>

</body>
</html>
